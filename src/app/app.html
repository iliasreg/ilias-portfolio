<div class="shell" [attr.data-scene]="svc.currentScene()">
  <main class="stage">
    <app-home *ngIf="svc.currentScene() === 0" animate.enter="anim-clip-up" animate.leave="anim-clip-down"></app-home>
    <app-work *ngIf="svc.currentScene() === 1" animate.enter="anim-clip-up" animate.leave="anim-clip-down"></app-work>
    <app-stack *ngIf="svc.currentScene() === 2" animate.enter="anim-clip-up" animate.leave="anim-clip-down"></app-stack>
    <app-contact *ngIf="svc.currentScene() === 3" animate.enter="anim-clip-up" animate.leave="anim-clip-down"></app-contact>
  </main>

  <div class="scene-index" aria-label="Section navigation">
    <button
      type="button"
      *ngFor="let scene of svc.scenes"
      [class.active]="svc.currentScene() === scene.id"
      (click)="svc.goTo(scene.id)"
      [attr.aria-label]="scene.label"
    ><span class="indicator-line"></span><span class="sr-only">{{ scene.label }}</span></button>
  </div>
</div>
